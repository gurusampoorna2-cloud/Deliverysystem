                          >
                            See More Customers
                          </button>
                        </div>
                      )}
                    </div>
                  </div>

                ) : (
                  
                  <div className="animate-in fade-in duration-500">
                    <div className="mb-6 border-b border-slate-100 pb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
                      <div>
                        <button 
                          onClick={() => setSelectedCustomerId('all')}
                          className="text-indigo-600 text-sm font-semibold hover:text-indigo-800 flex items-center mb-3 transition-colors"
                        >
                          ← Back to All Customers
                        </button>
                        <h3 className="text-xl sm:text-2xl font-bold text-slate-800 flex items-center">
                          <Users className="w-6 h-6 mr-3 text-indigo-500" />
                          {allKnownCustomers.find(c => c.id === selectedCustomerId)?.name || selectedCustomerId}
                        </h3>
                        <p className="text-sm text-slate-500 mt-1 ml-9 font-mono">ID: {selectedCustomerId}</p>
                      </div>
                      
                      {selectedCustomerDetails && (
                        <div className="flex flex-wrap gap-3">
                          <div className="bg-slate-50 px-4 py-3 rounded-xl border border-slate-100 min-w-[100px]">
                            <p className="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1">Total Revenue</p>
                            <p className="text-lg font-bold text-slate-800">{formatCurrency(selectedCustomerDetails.totalRevenue)}</p>
                          </div>
                          <div className="bg-slate-50 px-4 py-3 rounded-xl border border-slate-100 min-w-[100px]">
                            <p className="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1">% of Total Period</p>
                            <p className="text-lg font-bold text-slate-800">
                              {analytics.overallFilteredTotalRevenue > 0 ? ((selectedCustomerDetails.totalRevenue / analytics.overallFilteredTotalRevenue) * 100).toFixed(1) : 0}%
                            </p>
                          </div>
                          <div 
                            className="bg-slate-50 px-4 py-3 rounded-xl border border-slate-100 min-w-[100px] cursor-pointer hover:bg-indigo-50 hover:border-indigo-200 transition-all group shadow-sm hover:shadow-md"
                            onClick={() => setShowOrderModal(true)}
                          >
                            <p className="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1 group-hover:text-indigo-500 transition-colors">Total Orders</p>
                            <p className="text-lg font-bold text-indigo-600 underline decoration-indigo-300 underline-offset-4">{selectedCustomerDetails.orderCount}</p>
                          </div>
                        </div>
                      )}
                    </div>

                    <div className="space-y-4">
                      <h4 className="text-sm font-bold text-slate-700 uppercase tracking-wider mb-4 flex items-center">
                        <Package className="w-4 h-4 mr-2 text-slate-400" /> Products Purchased
                      </h4>
                      
                      {selectedCustomerDetails && selectedCustomerDetails.products.length === 0 ? (
                        <p className="text-sm text-slate-400 py-4 text-center">No products found for this customer in the selected period.</p>
                      ) : (
                        selectedCustomerDetails?.products.map((prod, idx) => {
                          const maxVal = selectedCustomerDetails.products[0]?.revenue || 1;
                          const barPercentage = (prod.revenue / maxVal) * 100;
                          const colorClass = barColors[idx % barColors.length];
                          
                          return (
                            <div key={idx} className="flex flex-col group">
                              <div className="flex justify-between items-end mb-1.5">
                                <div className="flex items-center overflow-hidden w-2/3">
                                  <span className="w-5 sm:w-6 text-xs font-bold text-slate-400 mr-2 flex-shrink-0">#{idx + 1}</span>
                                  <span className="font-semibold text-slate-700 text-sm truncate pr-2">{prod.name}</span>
                                </div>
                                <div className="text-right flex items-center flex-shrink-0">
                                  <span className="font-bold text-slate-900 text-sm">{formatCurrency(prod.revenue)}</span>
                                  <span className="text-[10px] sm:text-xs font-bold text-indigo-600 ml-2 bg-indigo-50 border border-indigo-100 px-1.5 sm:px-2 py-0.5 rounded-md whitespace-nowrap">
                                    {formatVolume(prod)}
                                  </span>
                                </div>
                              </div>
                              <div className="w-full bg-slate-100 rounded-full h-3 overflow-hidden flex shadow-inner ml-7 sm:ml-8" style={{ width: 'calc(100% - 28px)' }}>
                                <div className={`h-full rounded-full ${colorClass} transition-all duration-1000`} style={{ width: `${Math.max(barPercentage, 0)}%` }}></div>
                              </div>
                            </div>
                          );
                        })
                      )}
                    </div>

                    {/* Orders Modal */}
                    {showOrderModal && selectedCustomerDetails && (
                      <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setShowOrderModal(false)}>
                        <div className="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden animate-in zoom-in-95 duration-200" onClick={e => e.stopPropagation()}>
                          <div className="flex items-center justify-between p-4 border-b border-slate-100 bg-slate-50/50">
                            <h3 className="font-bold text-slate-800 flex items-center">
                              <Calendar className="w-5 h-5 mr-2 text-indigo-500" /> 
                              Order History
                            </h3>
                            <button onClick={() => setShowOrderModal(false)} className="text-slate-400 hover:text-rose-500 bg-white hover:bg-rose-50 p-1.5 rounded-lg transition-colors border border-slate-200 hover:border-rose-200">
                              <X className="w-4 h-4" />
                            </button>
                          </div>
                          <div className="max-h-[60vh] overflow-y-auto p-4 space-y-2.5 custom-scrollbar">
                            {selectedCustomerDetails.orderList.length > 0 ? (
                                selectedCustomerDetails.orderList.map((order, idx) => (
                                  <div key={idx} className="flex justify-between items-center p-3.5 bg-white rounded-xl border border-slate-100 shadow-sm hover:border-indigo-100 transition-colors">
                                    <div className="flex items-center gap-3">
                                      <div className="w-8 h-8 rounded-full bg-indigo-50 text-indigo-500 flex items-center justify-center">
                                        <Calendar className="w-4 h-4" />
                                      </div>
                                      <span className="text-sm font-semibold text-slate-700">{order.date}</span>
                                    </div>
                                    <span className="text-sm font-bold text-indigo-600">{formatCurrency(order.value)}</span>
                                  </div>
                                ))
                            ) : (
                                <p className="text-sm text-slate-400 py-4 text-center">No dated orders found.</p>
                            )}
                          </div>
                        </div>
                      </div>
                    )}

                  </div>
                )}

              </div>
            </div>
          );
        }

        // --- 3. PRODUCT ANALYSIS SECTION ---
        function ProductSection({ data, currencyPrefix, goToUpload, includeB2B, setIncludeB2B, includeB2BProducts, setIncludeB2BProducts }) {
          const [filterType, setFilterType] = useState('current'); 
          const [selectedMonth, setSelectedMonth] = useState(new Date().getMonth().toString());
          const [selectedYear, setSelectedYear] = useState(new Date().getFullYear().toString());
          const [startDate, setStartDate] = useState('');
          const [endDate, setEndDate] = useState('');

          const [selectedProduct, setSelectedProduct] = useState('all');
          const [productSearch, setProductSearch] = useState('');
          const [isProductDropdownOpen, setIsProductDropdownOpen] = useState(false);
          const [showTopCustomers, setShowTopCustomers] = useState(false);
          
          const [revenueFilter, setRevenueFilter] = useState('all');
          const [customMaxRev, setCustomMaxRev] = useState('10000');
          
          const [deadStockFilter, setDeadStockFilter] = useState('none');
          const [customDeadStockDays, setCustomDeadStockDays] = useState('120');

          const [visibleCount, setVisibleCount] = useState(15);
          const dropdownRef = useRef(null);

          const monthsList = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
          const yearsList = Array.from({length: 100}, (_, i) => (new Date().getFullYear() - 5 + i).toString());

          React.useEffect(() => {
            const handleClickOutside = (event) => {
              if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
                setIsProductDropdownOpen(false);
              }
            };
            document.addEventListener('mousedown', handleClickOutside);
            return () => document.removeEventListener('mousedown', handleClickOutside);
          }, []);

          const getHeadline = () => {
            if (filterType === 'current') return `${monthsList[new Date().getMonth()].toUpperCase()} ${new Date().getFullYear()}`;
            if (filterType === 'monthYear') {
              if (selectedMonth === 'all' && selectedYear === 'all') return 'ALL TIME PRODUCTS';
              if (selectedMonth === 'all') return `YEAR ${selectedYear}`;
              if (selectedYear === 'all') return `${monthsList[parseInt(selectedMonth)]?.toUpperCase()} (ALL YEARS)`;
              return `${monthsList[parseInt(selectedMonth)]?.toUpperCase()} ${selectedYear}`;
            }
            if (filterType === 'range') return 'CUSTOM DATE RANGE';
            return 'PRODUCT ANALYSIS';
          };

          const globalProductStats = useMemo(() => {
            if (!data || data.length === 0) return { maxDate: 0, lastSold: {} };
            let maxDate = 0;
            const lastSold = {};
            
            data.forEach(row => {
              const dt = parseDateStr(findCol(row, ['DATE']));
              if (dt) {
                const t = dt.getTime();
                if (t > maxDate) maxDate = t; 
                
                const prodName = cleanProductStr(findCol(row, ['PRODUCTNAME', 'PRODUCT']) || 'Unknown Product');
                if (!lastSold[prodName] || t > lastSold[prodName]) {
                  lastSold[prodName] = t;
                }
              }
            });
            return { maxDate, lastSold };
          }, [data]);

          const globalProducts = useMemo(() => {
            if (!globalProductStats) return [];
            return Object.keys(globalProductStats.lastSold).sort((a,b) => a.localeCompare(b));
          }, [globalProductStats]);

          const baseData = useMemo(() => {
            if (!data || data.length === 0) return null;

            const augmentedData = data.map(row => {
              const qty = parseFloat(findCol(row, ['QUANTITY', 'QTY'])) || 0;
              const rate = parseFloat(findCol(row, ['RATE', 'PRICE'])) || 0;
              const prodName = cleanProductStr(findCol(row, ['PRODUCTNAME', 'PRODUCT']) || 'Unknown Product');
              const variant = cleanProductStr(findCol(row, ['PRODUCTVARIANT', 'VARIANT']) || '');
              const custInfo = extractCustomerInfo(row);
              
              return {
                ...row,
                parsedDate: parseDateStr(findCol(row, ['DATE'])),
                revenue: qty * rate,
                qty: qty,
                productName: prodName,
                variant: variant,
                customerName: custInfo.name,
                customerId: custInfo.id
              };
            });

            const today = new Date();
            const currentMonthNum = today.getMonth();
            const currentYearNum = today.getFullYear();

            let dateFilteredData = augmentedData;

            if (filterType === 'current') {
              dateFilteredData = augmentedData.filter(d => 
                d.parsedDate && d.parsedDate.getMonth() === currentMonthNum && d.parsedDate.getFullYear() === currentYearNum
              );
            } else if (filterType === 'monthYear') {
              dateFilteredData = augmentedData.filter(d => {
                if (!d.parsedDate) return false;
                const mMatch = selectedMonth === 'all' || d.parsedDate.getMonth() === parseInt(selectedMonth);
                const yMatch = selectedYear === 'all' || d.parsedDate.getFullYear() === parseInt(selectedYear);
                return mMatch && yMatch;
              });
            } else if (filterType === 'range') {
              const start = startDate ? new Date(startDate) : null;
              const end = endDate ? new Date(endDate) : null;
              if (start && end) {
                end.setHours(23, 59, 59, 999);
                dateFilteredData = augmentedData.filter(d => 
                  d.parsedDate && d.parsedDate >= start && d.parsedDate <= end
                );
              }
            }

            return { dateFilteredData };
          }, [data, filterType, selectedMonth, selectedYear, startDate, endDate]);

          const analytics = useMemo(() => {
            if (!baseData || !globalProductStats) return null;

            let finalData = baseData.dateFilteredData;
            let thresholdTime = 0;
            const productMap = {};
            let overallFilteredTotalRevenue = 0;

            baseData.dateFilteredData.forEach(row => {
              overallFilteredTotalRevenue += row.revenue;
            });

            if (deadStockFilter !== 'none') {
                const days = deadStockFilter === 'custom' ? parseInt(customDeadStockDays) || 0 : parseInt(deadStockFilter);
                thresholdTime = globalProductStats.maxDate - (days * 24 * 60 * 60 * 1000);
                
                Object.keys(globalProductStats.lastSold).forEach(pName => {
                    if (globalProductStats.lastSold[pName] <= thresholdTime) {
                        productMap[pName] = {
                            name: pName,
                            revenue: 0,
                            quantity: 0,
                            totalL: 0,
                            totalKg: 0,
                            totalUnits: 0,
                            lastSoldTime: globalProductStats.lastSold[pName]
                        };
                    }
                });
            }

            if (selectedProduct !== 'all') {
                finalData = finalData.filter(d => d.productName === selectedProduct);
            }

            let totalRevenue = 0;
            let totalQuantity = 0;
            const variantMap = {}; 
            const productCustomersMap = {}; 

            finalData.forEach(row => {
                if (deadStockFilter !== 'none' && !productMap[row.productName]) return;

                totalRevenue += row.revenue;
                totalQuantity += row.qty;
                
                if (!productMap[row.productName]) {
                    productMap[row.productName] = { 
                      name: row.productName, 
                      revenue: 0, 
                      quantity: 0,
                      totalL: 0,
                      totalKg: 0,
                      totalUnits: 0,
                      lastSoldTime: globalProductStats.lastSold[row.productName] || 0
                    };
                }
                productMap[row.productName].revenue += row.revenue;
                productMap[row.productName].quantity += row.qty;
                
                const parsedVol = parseVolumeWeight(row.variant, row.qty, row.productName);
                if (parsedVol.type === 'L') productMap[row.productName].totalL += parsedVol.val;
                else if (parsedVol.type === 'kg') productMap[row.productName].totalKg += parsedVol.val;
                else productMap[row.productName].totalUnits += parsedVol.val;

                if (selectedProduct !== 'all') {
                    const vName = row.variant || 'Standard';
                    if (!variantMap[vName]) {
                        variantMap[vName] = {
                            name: vName,
                            revenue: 0,
                            quantity: 0,
                            totalL: 0,
                            totalKg: 0,
                            totalUnits: 0
                        };
                    }
                    variantMap[vName].revenue += row.revenue;
                    variantMap[vName].quantity += row.qty;
                    if (parsedVol.type === 'L') variantMap[vName].totalL += parsedVol.val;
                    else if (parsedVol.type === 'kg') variantMap[vName].totalKg += parsedVol.val;
                    else variantMap[vName].totalUnits += parsedVol.val;

                    const cid = row.customerId;
                    if (!productCustomersMap[cid]) {
                        productCustomersMap[cid] = { 
                          id: cid, 
                          name: row.customerName, 
                          revenue: 0, 
                          quantity: 0,
                          totalL: 0,
                          totalKg: 0,
                          totalUnits: 0 
                        };
                    }
                    productCustomersMap[cid].revenue += row.revenue;
                    productCustomersMap[cid].quantity += row.qty;
                    
                    if (parsedVol.type === 'L') productCustomersMap[cid].totalL += parsedVol.val;
                    else if (parsedVol.type === 'kg') productCustomersMap[cid].totalKg += parsedVol.val;
                    else productCustomersMap[cid].totalUnits += parsedVol.val;
                }
            });

            let productsArr = Object.values(productMap);

            if (deadStockFilter !== 'none') {
                 productsArr.sort((a,b) => a.lastSoldTime - b.lastSoldTime);
            } else {
                 productsArr.sort((a,b) => b.revenue - a.revenue);
            }

            let variantsArr = Object.values(variantMap).sort((a,b) => b.revenue - a.revenue);
            let productCustomersArr = Object.values(productCustomersMap).sort((a,b) => b.revenue - a.revenue);

            if (revenueFilter === 'lt-10k') productsArr = productsArr.filter(p => p.revenue < 10000);
            else if (revenueFilter === 'lt-50k') productsArr = productsArr.filter(p => p.revenue < 50000);
            else if (revenueFilter === 'lt-100k') productsArr = productsArr.filter(p => p.revenue < 100000);
            else if (revenueFilter === 'custom') productsArr = productsArr.filter(p => p.revenue <= (parseFloat(customMaxRev) || 0));

            const allPeriodProducts = Object.values(baseData.dateFilteredData.reduce((acc, row) => {
                if (!acc[row.productName]) acc[row.productName] = { revenue: 0 };
                acc[row.productName].revenue += row.revenue;
                return acc;
            }, {})).sort((a,b) => b.revenue - a.revenue);

            const top20Count = Math.max(1, Math.ceil(allPeriodProducts.length * 0.2));
            const top20Revenue = allPeriodProducts.slice(0, top20Count).reduce((sum, p) => sum + p.revenue, 0);
            const paretoPercentage = overallFilteredTotalRevenue > 0 ? (top20Revenue / overallFilteredTotalRevenue) * 100 : 0;

            return {
                totalProducts: allPeriodProducts.length,
                allProducts: productsArr,
                selectedProductVariants: variantsArr,
                selectedProductCustomers: productCustomersArr,
                totalRevenue,
                totalQuantity,
                overallFilteredTotalRevenue,
                paretoPercentage,
                top20Count,
                top20Revenue
            };
          }, [baseData, selectedProduct, revenueFilter, customMaxRev, deadStockFilter, customDeadStockDays, globalProductStats]);

          React.useEffect(() => {
            setVisibleCount(15);
            setShowTopCustomers(false);
          }, [baseData, selectedProduct, revenueFilter, deadStockFilter]);

          if (!baseData || !analytics) return <NoDataPrompt goToUpload={goToUpload} />;

          const formatCurrency = (val) => `${currencyPrefix}${val.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
          const visibleProducts = analytics.allProducts.slice(0, visibleCount);
          
          const filteredDropdownProducts = globalProducts.filter(p => 
             p.toLowerCase().includes(productSearch.toLowerCase())
          );

          const barColors = [
            'bg-sky-500', 'bg-rose-500', 'bg-amber-500', 'bg-teal-500',

                        analytics.selectedProductVariants.length === 0 ? (
                          <p className="text-sm text-slate-400 py-4 text-center">No variant details found.</p>
                        ) : (
                          analytics.selectedProductVariants.map((v, idx) => {
                            const maxVal = analytics.selectedProductVariants[0]?.revenue || 1;
                            const barPercentage = (v.revenue / maxVal) * 100;
                            const colorClass = barColors[idx % barColors.length];
                            
                            return (

        function BusinessSection({ data, currencyPrefix, goToUpload }) {
          const [filterType, setFilterType] = useState('current'); 
          const [selectedMonth, setSelectedMonth] = useState(new Date().getMonth().toString());
          const [selectedYear, setSelectedYear] = useState(new Date().getFullYear().toString());
          const [startDate, setStartDate] = useState('');
          const [endDate, setEndDate] = useState('');

          const monthsList = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
          const yearsList = Array.from({length: 100}, (_, i) => (new Date().getFullYear() - 5 + i).toString());

          const getHeadline = () => {
            if (filterType === 'current') return `${monthsList[new Date().getMonth()].toUpperCase()} ${new Date().getFullYear()}`;
            if (filterType === 'monthYear') {
              if (selectedMonth === 'all' && selectedYear === 'all') return 'ALL TIME B2B';
              if (selectedMonth === 'all') return `YEAR ${selectedYear}`;
              if (selectedYear === 'all') return `${monthsList[parseInt(selectedMonth)]?.toUpperCase()} (ALL YEARS)`;
              return `${monthsList[parseInt(selectedMonth)]?.toUpperCase()} ${selectedYear}`;
            }
            if (filterType === 'range') return 'CUSTOM DATE RANGE';
            return 'BUSINESS REVENUE';
          };

          const analytics = useMemo(() => {
            if (!data || data.length === 0) return null;

            const augmentedData = data.map(row => {
              const qty = parseFloat(findCol(row, ['QUANTITY', 'QTY'])) || 0;
              const rate = parseFloat(findCol(row, ['RATE', 'PRICE'])) || 0;
              const custInfo = extractCustomerInfo(row);
              return {
                ...row,
                parsedDate: parseDateStr(findCol(row, ['DATE'])),
                revenue: qty * rate,
                customerName: custInfo.name,
                customerId: custInfo.id
              };
            });

            const today = new Date();
            const currentMonthNum = today.getMonth();
            const currentYearNum = today.getFullYear();

            let filteredData = augmentedData;

            if (filterType === 'current') {
              filteredData = augmentedData.filter(d => d.parsedDate && d.parsedDate.getMonth() === currentMonthNum && d.parsedDate.getFullYear() === currentYearNum);
            } else if (filterType === 'monthYear') {
              filteredData = augmentedData.filter(d => {
                if (!d.parsedDate) return false;
                const mMatch = selectedMonth === 'all' || d.parsedDate.getMonth() === parseInt(selectedMonth);
                const yMatch = selectedYear === 'all' || d.parsedDate.getFullYear() === parseInt(selectedYear);
                return mMatch && yMatch;
              });
            } else if (filterType === 'range') {
              const start = startDate ? new Date(startDate) : null;
              const end = endDate ? new Date(endDate) : null;
              if (start && end) {
                end.setHours(23, 59, 59, 999);
                filteredData = augmentedData.filter(d => d.parsedDate && d.parsedDate >= start && d.parsedDate <= end);
              }
            }

            let totalRevenue = 0;
            const customersMap = {};

            filteredData.forEach(row => {
              totalRevenue += row.revenue;
              const cid = row.customerId;
              if (!customersMap[cid]) {
                customersMap[cid] = { id: cid, name: row.customerName, value: 0 };
              }
              customersMap[cid].value += row.revenue;
            });

            const customersArr = Object.values(customersMap).sort((a,b) => b.value - a.value);

            const last12Months = [];
            const isFullYearSelected = filterType === 'monthYear' && selectedMonth === 'all' && selectedYear !== 'all';

            if (isFullYearSelected) {
              const targetYear = parseInt(selectedYear);
              for (let i = 0; i < 12; i++) {
                const d = new Date(targetYear, i, 1);
                last12Months.push({ 
                  label: d.toLocaleString('default', { month: 'short', year: '2-digit' }), 
                  month: i, 
                  year: targetYear, 
                  value: 0 
                });
              }
            } else {
              for (let i = 11; i >= 0; i--) {
                const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
                last12Months.push({ 
                  label: d.toLocaleString('default', { month: 'short', year: '2-digit' }), 
                  month: d.getMonth(), 
                  year: d.getFullYear(), 
                  value: 0 
                });
              }
            }

            augmentedData.forEach(row => {
              if (!row.parsedDate || row.revenue <= 0) return;
              const monthBucket = last12Months.find(m => m.month === row.parsedDate.getMonth() && m.year === row.parsedDate.getFullYear());
              if (monthBucket) monthBucket.value += row.revenue;
            });

            return {
              totalRevenue,
              recordCount: filteredData.length,
              topCustomers: customersArr,
              last12Months
            };
          }, [data, filterType, selectedMonth, selectedYear, startDate, endDate]);

          if (!analytics) return (
            <div className="h-full flex flex-col items-center justify-center text-center animate-in fade-in py-20 px-4">
              <div className="w-24 h-24 bg-blue-50 rounded-full flex items-center justify-center mb-6">
                <Building2 className="w-12 h-12 text-blue-300" />
              </div>
              <h2 className="text-2xl font-bold text-slate-700 mb-2">No Business Data Found</h2>
              <p className="text-slate-500 mb-6 max-w-md">There is no data for the business customers currently set in your Settings.</p>
            </div>

          const formatCurrency = (val) => `${currencyPrefix}${val.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

          return (

                  B2B: {getHeadline()}

                <div className="flex flex-col lg:flex-row lg:items-center gap-4 sm:gap-6">

                    <div className="flex gap-2 overflow-x-auto pb-2 sm:pb-0 custom-scrollbar w-full">

                      <button onClick={() => setFilterType('monthYear')} className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors whitespace-nowrap flex-shrink-0 ${filterType === 'monthYear' ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>By Month/Year</button>
                      <button onClick={() => setFilterType('range')} className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors whitespace-nowrap flex-shrink-0 ${filterType === 'range' ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>Custom Range</button>
                    </div>
                  </div>

                  <div className="flex-1 flex items-center gap-4 w-full">
                    {filterType === 'monthYear' && (
                      <div className="flex flex-col sm:flex-row gap-3 w-full sm:max-w-sm animate-in fade-in">
                        <select value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} className="w-full sm:flex-1 bg-slate-50 border border-slate-200 text-slate-700 rounded-xl px-4 py-2 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none">
                          <option value="all">All Months</option>
                          {monthsList.map((m, i) => <option key={i} value={i}>{m}</option>)}
                        </select>
                        <select value={selectedYear} onChange={e => setSelectedYear(e.target.value)} className="w-full sm:w-1/3 bg-slate-50 border border-slate-200 text-slate-700 rounded-xl px-4 py-2 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none">
                          <option value="all">All Years</option>
                          {yearsList.map(y => <option key={y} value={y}>{y}</option>)}
                        </select>
                      </div>
                    )}
                    {filterType === 'range' && (
                      <div className="flex flex-col sm:flex-row sm:items-center gap-3 w-full max-w-md animate-in fade-in">
                        <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="w-full sm:flex-1 bg-slate-50 border border-slate-200 text-slate-700 rounded-xl px-3 py-2 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none" />
                        <span className="text-slate-400 text-sm hidden sm:block">to</span>
                        <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className="w-full sm:flex-1 bg-slate-50 border border-slate-200 text-slate-700 rounded-xl px-3 py-2 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none" />
                      </div>
                    )}
                  </div>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
                <div className="bg-white rounded-3xl p-4 sm:p-6 shadow-sm border border-slate-100 flex items-center relative overflow-hidden">
                  <div className="absolute -right-4 -top-4 w-24 h-24 bg-blue-50 rounded-full flex items-center justify-center opacity-50">
                    <DollarSign className="w-12 h-12 text-blue-300" />
                  </div>
                  <div className="relative z-10">
                    <p className="text-sm font-semibold text-slate-500 mb-1">Total B2B Revenue</p>
                    <h3 className="text-2xl sm:text-3xl md:text-4xl font-bold text-blue-900">{formatCurrency(analytics.totalRevenue)}</h3>
                  </div>
                </div>
                <div className="bg-white rounded-3xl p-4 sm:p-6 shadow-sm border border-slate-100 flex items-center relative overflow-hidden">
                  <div className="absolute -right-4 -top-4 w-24 h-24 bg-indigo-50 rounded-full flex items-center justify-center opacity-50">
                    <Building2 className="w-12 h-12 text-indigo-300" />
                  </div>
                  <div className="relative z-10">
                    <p className="text-sm font-semibold text-slate-500 mb-1">Active Business Accounts</p>
                    <h3 className="text-2xl sm:text-3xl md:text-4xl font-bold text-slate-800">{analytics.topCustomers.length}</h3>
                  </div>
                </div>
              </div>

              <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-4 sm:p-6">
                <div className="mb-2">
                  <h3 className="text-base font-bold text-slate-800 flex items-center">
                    <LineChart className="w-4 h-4 mr-2 text-indigo-500" />
                    {filterType === 'monthYear' && selectedMonth === 'all' && selectedYear !== 'all' ? `Year ${selectedYear} B2B Revenue` : 'Last 12 Months B2B Revenue'}
                  </h3>
                </div>
                <SimpleBarChart data={analytics.last12Months} currencyPrefix={currencyPrefix} labelKey="label" valueKey="value" height={180} minBarWidth="min-w-[60px]" scrollToEnd={true} />
              </div>

              <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-4 sm:p-6 md:p-8">
                <div className="mb-6 border-b border-slate-100 pb-4">
                  <h3 className="text-lg font-bold text-slate-800 flex items-center">
                    <Building2 className="w-5 h-5 mr-2 text-blue-600" />
                    Business Customer Rankings
                  </h3>
                </div>
                <div className="space-y-4">
                  {analytics.topCustomers.length > 0 ? analytics.topCustomers.map((item, index) => {
                    const maxVal = analytics.topCustomers[0]?.value || 1;
                    const barPercentage = (item.value / maxVal) * 100;
                    const totalPct = analytics.totalRevenue > 0 ? ((item.value / analytics.totalRevenue) * 100).toFixed(1) : 0;
                    
                    return (
                      <div key={index} className="flex flex-col group">
                        <div className="flex justify-between items-end mb-1.5">
                          <div className="flex items-center overflow-hidden">
                            <span className="w-5 sm:w-6 text-xs font-bold text-slate-400 mr-2">#{index + 1}</span>
                            <div className="flex flex-col overflow-hidden">
                               <span className="font-semibold text-slate-700 text-sm truncate pr-2 sm:pr-4">{item.name}</span>
                               <span className="text-[10px] text-slate-400 font-mono truncate mt-0.5">ID: {item.id}</span>
                            </div>
                          </div>
                          <div className="text-right flex items-center flex-shrink-0">
                            <span className="font-bold text-blue-900 text-sm">{formatCurrency(item.value)}</span>
                            <span className="text-[10px] sm:text-xs font-bold text-slate-500 ml-2 bg-slate-100 px-1.5 sm:px-2 py-0.5 rounded-md w-10 sm:w-12 text-center">
                              {totalPct}%
                            </span>
                          </div>
                        </div>
                        <div className="w-full bg-slate-100 rounded-full h-3 overflow-hidden flex shadow-inner ml-7 sm:ml-8" style={{ width: 'calc(100% - 28px)' }}>
                          <div className="h-full rounded-full bg-blue-500 transition-all duration-1000" style={{ width: `${Math.max(barPercentage, 0)}%` }}></div>
                        </div>
                      </div>
                    );
                  }) : (
                    <p className="text-sm text-slate-400 py-4 text-center">No transactions found for Business Customers in this period.</p>
                  )}
                </div>
              </div>
            </div>
          );
        }

        function SettingsSection({ currencyPrefix, setCurrencyPrefix, businessCustomers, setBusinessCustomers, businessProducts, setBusinessProducts, hiddenCustomers, setHiddenCustomers, showHiddenCustomers, setShowHiddenCustomers, allFilesData }) {
          const [newB2B, setNewB2B] = useState('');
          const [newB2BProduct, setNewB2BProduct] = useState('');

          const [hiddenSearch, setHiddenSearch] = useState('');
          const [isHiddenDropdownOpen, setIsHiddenDropdownOpen] = useState(false);
          const hiddenDropdownRef = useRef(null);

          React.useEffect(() => {
            const handleClickOutside = (event) => {
              if (hiddenDropdownRef.current && !hiddenDropdownRef.current.contains(event.target)) {
                setIsHiddenDropdownOpen(false);
              }
            };
            document.addEventListener('mousedown', handleClickOutside);
            return () => document.removeEventListener('mousedown', handleClickOutside);
          }, []);

          const allKnownCustomerNames = useMemo(() => {
              if (!allFilesData) return [];
              const safeFilesData = Array.isArray(allFilesData) ? allFilesData : [];
              const namesMap = new Map();
              safeFilesData.forEach(row => {
                  if (!row || typeof row !== 'object') return;
                  const custInfo = extractCustomerInfo(row);
                  if (!namesMap.has(custInfo.id)) namesMap.set(custInfo.id, custInfo.name);
              });
              return Array.from(namesMap.entries()).map(([id, name]) => ({id, name})).sort((a,b) => a.name.localeCompare(b.name));
          }, [allFilesData]);

          const filteredHiddenSearch = allKnownCustomerNames.filter(c => 
              c.name.toLowerCase().includes(hiddenSearch.toLowerCase()) || 
              c.id.toLowerCase().includes(hiddenSearch.toLowerCase())
          );

          const handleAddHidden = (nameOrId) => {
              if (!nameOrId) return;
              if (!hiddenCustomers.some(c => String(c).toLowerCase() === String(nameOrId).toLowerCase())) {
                  setHiddenCustomers([...hiddenCustomers, nameOrId]);
              }
              setHiddenSearch('');
              setIsHiddenDropdownOpen(false);
          };

          const removeHidden = (nameToRemove) => {
              setHiddenCustomers(hiddenCustomers.filter(name => name !== nameToRemove));
          };

          const handleAddB2B = (e) => {
            e.preventDefault();
            if (newB2B.trim() === '') return;
            
            if (!businessCustomers.some(c => String(c).toLowerCase() === newB2B.trim().toLowerCase())) {
              setBusinessCustomers([...businessCustomers, newB2B.trim()]);
            }
            setNewB2B('');
          };

          const removeB2B = (nameToRemove) => {
            setBusinessCustomers(businessCustomers.filter(name => name !== nameToRemove));
          };

          const handleAddB2BProduct = (e) => {
            e.preventDefault();
            if (newB2BProduct.trim() === '') return;
            
            if (!businessProducts.some(p => String(p).toLowerCase() === newB2BProduct.trim().toLowerCase())) {
              setBusinessProducts([...businessProducts, newB2BProduct.trim()]);
            }
            setNewB2BProduct('');
          };

          const removeB2BProduct = (nameToRemove) => {
            setBusinessProducts(businessProducts.filter(name => name !== nameToRemove));
          };

          return (
            <div className="max-w-3xl mx-auto space-y-4 sm:space-y-6 animate-in slide-in-from-bottom-4 duration-500 pb-10">
              
              {/* General Settings */}
              <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="p-4 sm:p-6 border-b border-slate-100 bg-slate-50/50">
                  <h2 className="text-xl font-bold text-slate-800 flex items-center">
                    <Settings className="w-5 h-5 mr-2 text-rose-400" />
                    Dashboard Preferences
                  </h2>
                  <p className="text-sm text-slate-500 mt-1">Customize how your analytics are displayed.</p>
                </div>
                
                <div className="p-4 sm:p-6 space-y-6">
                  
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                      <h4 className="font-semibold text-slate-700 text-sm">Currency Symbol</h4>
                      <p className="text-xs text-slate-500 mt-1">Select the prefix for monetary values in analysis.</p>
                    </div>
                    <select 
                      value={currencyPrefix}
                      onChange={(e) => setCurrencyPrefix(e.target.value)}
                      className="bg-slate-50 border border-slate-200 text-slate-700 rounded-xl px-4 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full sm:w-auto"
                    >
                      <option value="$">USD ($)</option>
                      <option value="€">EUR (€)</option>

                    </select>
                  </div>

                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 opacity-60">
                    <div>

                      <p className="text-xs text-slate-500 mt-1">Toggle between light and dark visualization modes.</p>
                    </div>
                    <div className="flex bg-slate-100 rounded-xl p-1 pointer-events-none w-full sm:w-auto justify-center">
                      <button className="flex-1 sm:flex-none px-4 py-1.5 text-xs font-semibold bg-white shadow-sm rounded-lg text-slate-800">Light</button>
                      <button className="flex-1 sm:flex-none px-4 py-1.5 text-xs font-semibold text-slate-500 rounded-lg">Dark</button>
                    </div>
                  </div>

                </div>
              </div>

              {/* Hidden Customers Management */}
              <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-visible relative z-20">
                <div className="p-4 sm:p-6 border-b border-slate-100 bg-rose-50/50 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <h2 className="text-xl font-bold text-rose-900 flex items-center">

                      </div>

                    {isHiddenDropdownOpen && hiddenSearch.trim().length > 0 && (

                            <li

                              onClick={() => handleAddHidden(c.name)}
                              className="px-4 py-3 hover:bg-rose-50 hover:text-rose-700 rounded-lg cursor-pointer text-sm transition-colors flex flex-col text-slate-700"
                            >
                              <span className="font-semibold truncate">{c.name}</span>
                              <span className="text-[10px] text-slate-400 font-mono truncate mt-0.5">ID: {c.id}</span>
                            </li>
                          ))}
                          {filteredHiddenSearch.length === 0 && (
                            <li className="px-4 py-4 text-center text-sm text-slate-400 flex flex-col gap-2">
                              <span>No matching customers found in the data.</span>
                              <button 
                                onClick={() => handleAddHidden(hiddenSearch)}
                                className="text-rose-600 font-medium hover:underline"
                              >
                                Add "{hiddenSearch}" exactly anyway
                              </button>
                            </li>
                          )}
                        </ul>
                      </div>
                    )}
                  </div>

                  <div className="space-y-2">
                    <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Currently Hidden Customers ({hiddenCustomers.length})</h4>
                    {hiddenCustomers.length === 0 ? (
                      <div className="text-center py-6 border-2 border-dashed border-slate-200 rounded-xl bg-slate-50 text-sm text-slate-500 px-4">
                        No customers are being hidden.
                      </div>
                    ) : (
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        {hiddenCustomers.map((customer, idx) => (
                          <div key={idx} className="flex items-center justify-between bg-white border border-slate-200 rounded-xl p-3 shadow-sm hover:border-rose-300 transition-colors">
                            <div className="flex items-center overflow-hidden">
                              <div className="w-8 h-8 bg-rose-50 text-rose-600 rounded-full flex items-center justify-center mr-3 flex-shrink-0">
                                <UserX className="w-4 h-4" />
                              </div>
                              <span className="font-semibold text-slate-700 text-sm truncate">{customer}</span>
                            </div>
                            <button 
                              onClick={() => removeHidden(customer)}
                              className="text-slate-400 hover:text-rose-500 hover:bg-rose-50 p-2 rounded-lg transition-colors flex-shrink-0"
                              title="Restore customer data"
                            >
                              <Trash2 className="w-4 h-4" />
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              </div>

              {/* Business Customer Management */}
              <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="p-4 sm:p-6 border-b border-slate-100 bg-blue-50/50">
                  <h2 className="text-xl font-bold text-blue-900 flex items-center">
                    <Building2 className="w-5 h-5 mr-2 text-blue-600" />
                    Business Customer Management
                  </h2>
                  <p className="text-sm text-slate-500 mt-1">Add client names or IDs here to segregate their data into the B2B Analytics sections.</p>
                </div>
                
                <div className="p-4 sm:p-6">
                  <div className="flex items-start text-blue-600 bg-blue-50 px-4 py-3 rounded-xl border border-blue-200 text-sm w-full mb-5">
                    <AlertCircle className="w-5 h-5 mr-3 flex-shrink-0 mt-0.5" />
                    <p>
                      <strong>Note:</strong> Customers with no ID or whose ID is "NA" are <span className="font-semibold underline">automatically</span> added to this list upon upload. You can manually remove them if they are not business customers.
                    </p>
                  </div>

                  <form onSubmit={handleAddB2B} className="flex flex-col sm:flex-row gap-3 mb-6">
                    <input 
                      type="text" 
                      value={newB2B}
                      onChange={(e) => setNewB2B(e.target.value)}
                      placeholder="Enter exact customer name or ID..."
                      className="w-full sm:flex-1 bg-slate-50 border border-slate-200 text-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                    <button 
                      type="submit"
                      className="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl font-medium transition-colors shadow-sm whitespace-nowrap"
                    >
                      Add Client
                    </button>
                  </form>

                  <div className="space-y-2">
                    <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Identified Business Customers ({businessCustomers.length})</h4>
                    {businessCustomers.length === 0 ? (
                      <div className="text-center py-6 border-2 border-dashed border-slate-200 rounded-xl bg-slate-50 text-sm text-slate-500 px-4">
                        No business customers added yet. (Auto-NA logic is still active).
                      </div>
                    ) : (
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        {businessCustomers.map((customer, idx) => (
                          <div key={idx} className="flex items-center justify-between bg-white border border-slate-200 rounded-xl p-3 shadow-sm hover:border-blue-300 transition-colors">
                            <div className="flex items-center overflow-hidden">
                              <div className="w-8 h-8 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mr-3 flex-shrink-0">
                                <Building2 className="w-4 h-4" />
                              </div>
                              <span className="font-semibold text-slate-700 text-sm truncate">{customer}</span>
                            </div>
                            <button 
                              onClick={() => removeB2B(customer)}
                              className="text-slate-400 hover:text-rose-500 hover:bg-rose-50 p-2 rounded-lg transition-colors flex-shrink-0"
                              title="Remove from B2B list"
                            >
                              <Trash2 className="w-4 h-4" />
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              </div>
              
              {/* Business Product Management */}
              <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="p-4 sm:p-6 border-b border-slate-100 bg-amber-50/50">
                  <h2 className="text-xl font-bold text-amber-900 flex items-center">
                    <Package className="w-5 h-5 mr-2 text-amber-600" />
                    Business Product Management
                  </h2>
                  <p className="text-sm text-slate-500 mt-1">Add product names here to globally exclude them from analysis unless "Include B2B Products" is toggled on.</p>
                </div>
                
                <div className="p-4 sm:p-6">
                  <form onSubmit={handleAddB2BProduct} className="flex flex-col sm:flex-row gap-3 mb-6">
                    <input 
                      type="text" 
                      value={newB2BProduct}
                      onChange={(e) => setNewB2BProduct(e.target.value)}
                      placeholder="Enter exact product name from CSV..."
                      className="w-full sm:flex-1 bg-slate-50 border border-slate-200 text-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                    />
                    <button 
                      type="submit"
                      className="w-full sm:w-auto bg-amber-600 hover:bg-amber-700 text-white px-6 py-2.5 rounded-xl font-medium transition-colors shadow-sm whitespace-nowrap"
                    >
                      Add Product
                    </button>
                  </form>

                  <div className="space-y-2">
                    <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Identified Business Products ({businessProducts.length})</h4>
                    {businessProducts.length === 0 ? (
                      <div className="text-center py-6 border-2 border-dashed border-slate-200 rounded-xl bg-slate-50 text-sm text-slate-500 px-4">
                        No business products added yet. B2B product exclusion is disabled.
                      </div>
                    ) : (
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        {businessProducts.map((product, idx) => (
                          <div key={idx} className="flex items-center justify-between bg-white border border-slate-200 rounded-xl p-3 shadow-sm hover:border-amber-300 transition-colors">
                            <div className="flex items-center overflow-hidden">
                              <div className="w-8 h-8 bg-amber-50 text-amber-600 rounded-full flex items-center justify-center mr-3 flex-shrink-0">
                                <Package className="w-4 h-4" />
                              </div>
                              <span className="font-semibold text-slate-700 text-sm truncate">{product}</span>
                            </div>
                            <button 
                              onClick={() => removeB2BProduct(product)}
                              className="text-slate-400 hover:text-rose-500 hover:bg-rose-50 p-2 rounded-lg transition-colors flex-shrink-0"
                              title="Remove from B2B product list"
                            >
                              <Trash2 className="w-4 h-4" />
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              </div>
              
            </div>
          );
        }

        // --- ERROR BOUNDARY ---
        class ErrorBoundary extends React.Component {
          constructor(props) {
            super(props);
            this.state = { hasError: false, errorInfo: null };
          }
          static getDerivedStateFromError(error) {
            return { hasError: true, errorInfo: error };
          }
          render() {
            if (this.state.hasError) {
              return (
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100vh', backgroundColor: '#f8fafc', padding: '20px', fontFamily: 'system-ui, sans-serif' }}>
                    <div style={{ backgroundColor: 'white', padding: '40px', borderRadius: '24px', boxShadow: '0 20px 25px -5px rgb(0 0 0 / 0.1)', textAlign: 'center', maxWidth: '500px' }}>
                        <h2 style={{ fontSize: '24px', fontWeight: 'bold', color: '#0f172a', marginBottom: '10px' }}>Dashboard Recovered from a Crash</h2>
                        <p style={{ color: '#64748b', marginBottom: '20px' }}>Corrupted or missing data was detected in your files or settings.</p>
                        <code style={{ display: 'block', backgroundColor: '#f1f5f9', padding: '15px', borderRadius: '12px', color: '#ef4444', fontSize: '12px', textAlign: 'left', overflow: 'auto', marginBottom: '20px', maxHeight: '150px' }}>
                            {this.state.errorInfo && this.state.errorInfo.toString()}
                        </code>
                        <button onClick={() => window.location.reload()} style={{ backgroundColor: '#4f46e5', color: 'white', padding: '10px 24px', borderRadius: '12px', fontWeight: '600', border: 'none', cursor: 'pointer' }}>Reload Dashboard</button>
                    </div>
                </div>
              );
            }
            return this.props.children;
          }
        }

        // --- RENDER APP TO DOM ---
        const root = createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
