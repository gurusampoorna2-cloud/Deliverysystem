    <!-- Import Maps for React, Firebase, and Lucide Icons -->
    <script type="importmap">
    {
      "imports": {

<body class="bg-slate-50 text-slate-800 antialiased overflow-hidden">
    
    <!-- React Root Element -->

    <!-- Application Code -->
    <script type="text/babel" data-type="module">
        import React, { useState, useMemo, useRef, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { initializeApp } from "firebase/app";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "firebase/auth";
        import { getFirestore, doc, setDoc, collection, onSnapshot, deleteDoc } from "firebase/firestore";
        import { 
          BarChart3, UploadCloud, Settings, FileSpreadsheet, TrendingUp,
          PieChart as PieChartIcon, DollarSign, Package, Activity,
          AlertCircle, Trash2, ChevronRight, Users, LineChart, Briefcase,
          Target, Calendar, Filter, TrendingDown, Menu, X, Building2,
          Search, ChevronDown, UserX, Archive, Cloud, LogOut, Download
        } from 'lucide-react';

        // --- FIREBASE INITIALIZATION ---
        const firebaseConfig = {
          apiKey: "AIzaSyCMppXprg2OJswgLSXmmPgyhaRhxwDp0NA",
          authDomain: "salarymanagement-7f0ec.firebaseapp.com",
          projectId: "salarymanagement-7f0ec",
          storageBucket: "salarymanagement-7f0ec.firebasestorage.app",
          messagingSenderId: "857263287159",
          appId: "1:857263287159:web:70b284c66afa5be7590f72"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        const db = getFirestore(app);

        // Updated to match the specific security rule path provided
        const APP_ID = "guru-salary-dashboard"; 

        // --- UTILS: CSV Parser ---
        const parseCSV = (text) => {
          let p = '', row = [''], ret = [row], i = 0, r = 0, s = !0, l;
          for (l of text) {
              if ('"' === l) {
                  if (s && l === p) row[i] += l;
                  s = !s;
              } else if (',' === l && s) l = row[++i] = '';
              else if ('\n' === l && s) {
                  if ('\r' === p) row[i] = row[i].slice(0, -1);
                  row = ret[++r] = [l = '']; i = 0;
              } else row[i] += l;
              p = l;
          }
          
          const rawHeaders = ret[0].map(h => h.trim());
          const headers = rawHeaders.filter(h => h !== ''); 
          
          const data = [];
          for (let j = 1; j < ret.length; j++) {
            if (ret[j].length === 1 && ret[j][0].trim() === '') continue; 
            const obj = {};
            headers.forEach((header, index) => {
              let val = ret[j][index] ? ret[j][index].trim() : '';
              const cleanVal = val.replace(/[,₹$€£\s]/g, '');
              const numVal = Number(cleanVal);
              obj[header] = (cleanVal !== '' && !isNaN(numVal)) ? numVal : val;
            });
            data.push(obj);
          }
          return { headers, data };
        };

        const findCol = (row, keywords) => {
          const keys = Object.keys(row);
          
          // 1. Exact match (case-insensitive, ignoring symbols/spaces)
          for (let k of keys) {
            const cleanK = k.toUpperCase().replace(/[^A-Z]/g, '');
            if (keywords.some(kw => cleanK === kw.toUpperCase().replace(/[^A-Z]/g, ''))) {
              return row[k];
            }
          }

          // 2. Partial match (only for keywords longer than 2 chars to prevent 'ID' matching 'PAID' or 'ORDERID')
          for (let k of keys) {
            const cleanK = k.toUpperCase().replace(/[^A-Z]/g, '');
            if (keywords.some(kw => {
              const cleanKw = kw.toUpperCase().replace(/[^A-Z]/g, '');
              return cleanKw.length > 2 && cleanK.includes(cleanKw);
            })) {
              return row[k];
            }
          }
          
          return null;
        };

        const cleanProductStr = (str) => {
          if (!str) return '';
          let s = String(str).trim();
          s = s.replace(/SHARBATI\s*\(VACUUM\)/i, 'SHARBATI');
          return s;
        };

        const extractCustomerInfo = (row) => {
          // Expanded column search list to catch more software variants
          let rawId = String(findCol(row, ['CUSTOMERID', 'CUSTID', 'CUSTOMERCODE', 'PARTYCODE', 'MEMBERID', 'USERID', 'CODE', 'ID']) || '').trim();
          let rawName = String(findCol(row, ['CUSTOMERNAME', 'CUSTNAME', 'PARTYNAME', 'LEDGERNAME', 'PARTY', 'LEDGER', 'NAME', 'COMPANY']) || '').trim();

          // INTELLIGENT PARSER: Check if ID is bundled inside the Name column (e.g. "A1444 SEEMA SHRIVASTAVA")
          if (!rawId && rawName) {
              const parts = rawName.split(' ');
              // If the first word contains numbers, it is highly likely an ID prefix
              if (parts.length > 1 && /\d/.test(parts[0])) {
                  rawId = parts[0];
                  rawName = parts.slice(1).join(' '); // Clean the name by removing the ID prefix
              }
          }

          let id = rawId;
          let name = rawName;

          if (id.toLowerCase() === 'd1' || id.toLowerCase() === 'd11') {
            id = 'NEW_CUSTOMER';
            name = 'New Customer';
          }

          // Only flag as B2B missing ID if it truly doesn't have an ID even after our split attempt
          const isMissingId = (!rawId || rawId.toLowerCase() === 'na');

          if (!id || id.toLowerCase() === 'na') {
            id = name || 'Unknown Customer';
          }
          
          if (!name) {
            name = id;
          }

          return { id, name, isMissingId, rawName: rawName || name };
        };

        const parseDateStr = (val) => {
          if (!val) return null;
          const d = new Date(val);
          return isNaN(d.getTime()) ? null : d;
        };

        const getUnitLabel = (productName) => {
          if (!productName) return 'units';
          return /wheat|cattle\s*feed|gaad/i.test(productName) ? 'kg' : 'units';
        };

        const parseVolumeWeight = (variantStr, qty, productName = '') => {
          const isKgProduct = /wheat|cattle\s*feed|gaad/i.test(productName);

          if (!variantStr) return { type: isKgProduct ? 'kg' : 'unit', val: qty };
          
          if (/refill/i.test(variantStr)) {
              return { type: 'L', val: qty };
          }
          
          const match = variantStr.match(/([\d.]+)\s*(ml|l|liter|liters|ltr|g|gm|gram|grams|kg|kilogram|kilograms)/i);
          if (match) {
            const val = parseFloat(match[1]);
            const unit = match[2].toLowerCase();
            
            if (['ml'].includes(unit)) return { type: 'L', val: (val / 1000) * qty };
            if (['l', 'liter', 'liters', 'ltr'].includes(unit)) return { type: 'L', val: val * qty };
            
            if (['g', 'gm', 'gram', 'grams'].includes(unit)) return { type: 'kg', val: (val / 1000) * qty };
            if (['kg', 'kilogram', 'kilograms'].includes(unit)) return { type: 'kg', val: val * qty };
          }
          
          const numMatch = variantStr.trim().match(/^([\d.]+)$/);
          if (numMatch) {
            const val = parseFloat(numMatch[1]);
            if (isKgProduct) {
               return { type: 'kg', val: val * qty };
            }
          }
          
          return { type: isKgProduct ? 'kg' : 'unit', val: qty };
        };

        const formatVolume = (prod) => {
          const parts = [];
          if (prod.totalL > 0) parts.push(`${prod.totalL.toLocaleString(undefined, {maximumFractionDigits: 2})} L`);
          if (prod.totalKg > 0) parts.push(`${prod.totalKg.toLocaleString(undefined, {maximumFractionDigits: 2})} kg`);
          
          if (prod.totalUnits > 0) {
            parts.push(`${prod.totalUnits.toLocaleString()} units`);
          }

          if (parts.length === 0) {
            parts.push(`0 ${getUnitLabel(prod.name)}`);
          }

          return parts.join(' + ');
        };

        // Missing NoDataPrompt Component addition
        function NoDataPrompt({ goToUpload }) {
          return (
            <div className="h-full flex flex-col items-center justify-center text-center animate-in py-20 px-4">
              <div className="w-24 h-24 bg-indigo-50 rounded-full flex items-center justify-center mb-6">
                <FileSpreadsheet className="w-12 h-12 text-indigo-300" />
              </div>
              <h2 className="text-2xl font-bold text-slate-700 mb-2">No Data Available</h2>
              <p className="text-slate-500 mb-6 max-w-md">Upload a CSV file or adjust your date filters to see analytics here.</p>
              <button onClick={goToUpload} className="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-xl font-medium shadow-sm transition-all">Go to Upload</button>
            </div>
          );
        }

        // --- MAIN APP COMPONENT ---
        function App() {
          const [activeTab, setActiveTab] = useState('upload');
          const [isSidebarOpen, setIsSidebarOpen] = useState(false);
          const [files, setFiles] = useState([]);
          const [activeFileId, setActiveFileId] = useState(null);
          const [pendingFile, setPendingFile] = useState(null);
          const [error, setError] = useState('');
          const [currencyPrefix, setCurrencyPrefix] = useState('₹');
          
          // Cloud Sync & Auth State
          const [user, setUser] = useState(null);
          const [isCheckingAuth, setIsCheckingAuth] = useState(true);
          const [authError, setAuthError] = useState('');
          const [isCloudSyncing, setIsCloudSyncing] = useState(true);

          const isUploadOnlyUser = user?.email === 'gurunaturalsagro@gmail.com';

          // Business States
          const [businessCustomers, setBusinessCustomers] = useState([]);
          const [includeB2B, setIncludeB2B] = useState(false);
          const [businessProducts, setBusinessProducts] = useState([]);
          const [includeB2BProducts, setIncludeB2BProducts] = useState(false);

          // Hidden Data States
          const [hiddenCustomers, setHiddenCustomers] = useState([]);
          const [showHiddenCustomers, setShowHiddenCustomers] = useState(false);

          // --- FIREBASE AUTH & SYNC ---
          useEffect(() => {
            const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
              if (currentUser) {
                // Enforce the user's explicit security rules on the frontend
                const allowedEmails = [
                  'gurunaturalsagro@gmail.com',
                  'govindpatidar789@gmail.com',
                  'sampoornataajaindore@gmail.com',
                  'gurukalsangra@gmail.com'
                ];

                if (allowedEmails.includes(currentUser.email)) {
                  setUser(currentUser);
                  setAuthError('');
                } else {
                  signOut(auth);
                  setUser(null);
                  setAuthError(`Access Denied: ${currentUser.email} is not authorized.`);
                }
              } else {
                setUser(null);
              }
              setIsCheckingAuth(false);
            });

            return () => unsubscribe();
          }, []);

          const handleGoogleLogin = async () => {
            try {
              setAuthError('');
              await signInWithPopup(auth, provider);
            } catch (err) {
              setAuthError("Login failed. Please try again or check your pop-up blocker.");
              console.error(err);
            }
          };

          useEffect(() => {
            if (!user) return;

            // Listen to Shared Settings (Global across devices)
            const settingsRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'settings', 'sharedSettings');
            const unsubSettings = onSnapshot(settingsRef, (docSnap) => {
              if (docSnap.exists()) {
                 const data = docSnap.data();
                 // ADDED ARRAYS CHECKS TO PREVENT .some() CRASHES
                 if (Array.isArray(data.businessCustomers)) setBusinessCustomers(data.businessCustomers);
                 if (Array.isArray(data.businessProducts)) setBusinessProducts(data.businessProducts);
                 if (Array.isArray(data.hiddenCustomers)) setHiddenCustomers(data.hiddenCustomers);
                 if (data.currencyPrefix) setCurrencyPrefix(data.currencyPrefix);
              }
            }, (err) => console.error("Settings listener error:", err));

            // Listen to Shared Files
            const filesRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'files');
            const unsubFiles = onSnapshot(filesRef, (snap) => {
              const loadedFiles = [];
              snap.forEach(d => {
                 const data = d.data();
                 let fileData = data.data;
                 if (typeof fileData === 'string') {
                     try { fileData = JSON.parse(fileData); } catch (e) { fileData = []; }
                 }
                 // CRITICAL FIX: Ensure fileData is always an array
                 if (!Array.isArray(fileData)) fileData = []; 
                 
                 loadedFiles.push({ ...data, data: fileData });
              });
              setFiles(loadedFiles.sort((a,b) => parseInt(b.id) - parseInt(a.id)));
              setIsCloudSyncing(false);
            }, (err) => {
               console.error("Files listener error:", err);
               setIsCloudSyncing(false);
            });

            return () => {
              unsubSettings();
              unsubFiles();
            };
          }, [user]);

          // Wrapper to sync settings changes to Firestore
          const updateCloudSettings = async (updates) => {
             if (!user) return;
             const settingsRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'settings', 'sharedSettings');
             await setDoc(settingsRef, updates, { merge: true }).catch(console.error);
          };

          const handleSetBusinessCustomers = (newList) => {
              setBusinessCustomers(newList);
              updateCloudSettings({ businessCustomers: newList });
          };

          const handleSetBusinessProducts = (newList) => {
              setBusinessProducts(newList);
              updateCloudSettings({ businessProducts: newList });
          };

          const handleSetCurrencyPrefix = (prefix) => {
              setCurrencyPrefix(prefix);
              updateCloudSettings({ currencyPrefix: prefix });
          };

          const handleSetHiddenCustomers = (newList) => {
              setHiddenCustomers(newList);
              updateCloudSettings({ hiddenCustomers: newList });
          };

          // --- DATA PROCESSING ---
          const activeFile = files.find(f => f.id === activeFileId);
          const csvData = activeFile ? activeFile.data : [];
          const allFilesData = useMemo(() => files.flatMap(f => f.data), [files]);

          const { standardData, b2bData } = useMemo(() => {
            const standard = [];
            const b2b = [];

            // CRITICAL FIX: Ensure allFilesData ignores non-arrays
            const safeFilesData = Array.isArray(allFilesData) ? allFilesData : [];

            safeFilesData.forEach(row => {
              // CRITICAL FIX: Skip if row is undefined/null
              if (!row || typeof row !== 'object') return; 

              const custInfo = extractCustomerInfo(row);
              const pName = String(findCol(row, ['PRODUCTNAME', 'PRODUCT']) || 'Unknown Product').trim();
              
              // CRITICAL FIX: Force String() comparison to prevent crashes
              const isHidden = hiddenCustomers.some(hc => 
                  String(hc).toLowerCase() === custInfo.name.toLowerCase() || 
                  String(hc).toLowerCase() === custInfo.id.toLowerCase()
              );
              
              if (isHidden && !showHiddenCustomers) return; 
              
              const isB2BCustomer = businessCustomers.some(bc => 
                  String(bc).toLowerCase() === custInfo.name.toLowerCase() || 
                  String(bc).toLowerCase() === custInfo.id.toLowerCase()
              );
              
              const isB2BProduct = businessProducts.some(bp => String(bp).toLowerCase() === pName.toLowerCase());
              
              if (isB2BProduct && !includeB2BProducts) return;
              
              if (isB2BCustomer) {
                b2b.push(row);
                if (includeB2B) standard.push(row);
              } else {
                standard.push(row);
              }
            });

            return { standardData: standard, b2bData: b2b };
          }, [allFilesData, businessCustomers, includeB2B, businessProducts, includeB2BProducts, hiddenCustomers, showHiddenCustomers]);

          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (!file.name.endsWith('.csv')) {
              setError('Please upload a valid .csv file.');
              return;
            }

            setError('');
            const reader = new FileReader();
            reader.onload = (event) => {
              try {
                const text = event.target.result;
                const { headers: parsedHeaders, data: parsedData } = parseCSV(text);
                
                if (parsedData.length === 0) {
                  setError('The uploaded CSV file is empty.');
                  return;
                }

                // Auto-detect business customers (missing or NA id)
                const autoB2b = new Set();
                parsedData.forEach(row => {
                  const custInfo = extractCustomerInfo(row);
                  if (custInfo.isMissingId && custInfo.rawName) {
                     autoB2b.add(custInfo.rawName);
                  }
                });
                
                if (autoB2b.size > 0) {
                  setBusinessCustomers(prev => {
                     const current = new Set(prev.map(c => String(c).toLowerCase()));
                     const combined = [...prev];
                     autoB2b.forEach(cName => {
                        if (!current.has(cName.toLowerCase())) combined.push(cName);
                     });
                     if (user) updateCloudSettings({ businessCustomers: combined });
                     return combined;
                  });
                }

                setPendingFile({
                  originalName: file.name,
                  headers: parsedHeaders,
                  data: parsedData
                });
              } catch (err) {
                setError('Error parsing CSV file. Please check the file format.');
              }
            };
            reader.onerror = () => setError('Error reading the file.');
            reader.readAsText(file);
            e.target.value = null;
          };

          const savePendingFile = async (month, year) => {
            if (!user) {
              setError("Waiting for Cloud connection...");
              return;
            }

            const fileId = Date.now().toString();
            const newFile = {
              id: fileId,
              name: `${month} ${year}`,
              originalName: pendingFile.originalName,
              headers: pendingFile.headers,
              data: pendingFile.data,
              date: new Date().toLocaleString('en-US', { 
                  year: 'numeric', 
                  month: 'short', 
                  day: 'numeric', 
                  hour: '2-digit', 
                  minute: '2-digit', 
                  hour12: true 
              })
            };
            
            // Optimistic UI Update
            setFiles(prev => [newFile, ...prev]);
            setActiveFileId(fileId);
            setPendingFile(null);

            // Save to Firestore (Stringify data to prevent complex nested array limits)
            try {
              const fileDocRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'files', fileId);
              await setDoc(fileDocRef, {
                  id: fileId,
                  name: newFile.name,
                  originalName: newFile.originalName,
                  headers: newFile.headers,
                  date: newFile.date,
                  data: JSON.stringify(newFile.data) 
              });
            } catch (err) {
              console.error(err);
              setError("Failed to sync file to cloud: " + err.message);
            }
          };

          const deleteFile = async (id) => {
            setFiles(prev => prev.filter(f => f.id !== id));
            if (activeFileId === id) setActiveFileId(null);
            
            if (user) {
               const fileDocRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'files', id);
               await deleteDoc(fileDocRef).catch(console.error);
            }
          };

          const selectFile = (id) => {
            setActiveFileId(id);
            if (!isUploadOnlyUser) setActiveTab('overall'); 
            setIsSidebarOpen(false);
          };

          const handleTabChange = (tab) => {
            setActiveTab(tab);
            setIsSidebarOpen(false);
          };

          // --- RENDER LOGIN OR APP ---

          if (isCheckingAuth) {
            return (
              <div className="flex h-screen w-full items-center justify-center bg-slate-50">
                <Activity className="w-10 h-10 animate-spin text-indigo-500" />
              </div>
            );
          }

          if (!user) {
            return (
              <div className="flex h-screen w-full items-center justify-center bg-slate-50 p-4">
                <div className="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full text-center border border-slate-100">
                  <div className="w-20 h-20 bg-indigo-50 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner border border-indigo-100">
                    <Activity className="w-10 h-10 text-indigo-600" />
                  </div>
                  <h1 className="text-3xl font-black text-slate-800 tracking-tight mb-2">GURU SALES</h1>
                  <p className="text-slate-500 mb-8 font-medium">Secure Analytics Dashboard</p>
                  
                  {authError && (
                    <div className="mb-6 p-4 bg-rose-50 text-rose-600 rounded-xl text-sm font-medium border border-rose-100 flex items-start text-left">
                      <AlertCircle className="w-5 h-5 mr-3 flex-shrink-0 mt-0.5" />
                      <span>{authError}</span>
                    </div>
                  )}
                  
                  <button 
                    onClick={handleGoogleLogin}
                    className="w-full flex items-center justify-center gap-3 bg-indigo-600 hover:bg-indigo-700 text-white py-3.5 rounded-xl font-bold shadow-lg shadow-indigo-200 transition-all hover:-translate-y-0.5 active:translate-y-0"
                  >
                    <div className="bg-white p-1 rounded-full">
                      <svg className="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                      </svg>
                    </div>
                    Sign in with Google
                  </button>
                  <p className="text-xs text-slate-400 mt-6 flex justify-center items-center">
                    <Settings className="w-3 h-3 mr-1" />
                    Protected by Cloud Firestore Rules
                  </p>
                </div>
              </div>
            );
          }

          return (
            <div className="flex h-screen bg-slate-50 font-sans text-slate-800 relative overflow-hidden">
              {/* OVERLAY */}
              {isSidebarOpen && (
                <div 
                  className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 transition-opacity"
                  onClick={() => setIsSidebarOpen(false)}
                />
              )}

              {/* SIDEBAR */}
              <aside className={`fixed inset-y-0 left-0 w-72 bg-blue-950 border-r border-blue-900 flex flex-col shadow-2xl z-50 transform transition-transform duration-300 ease-in-out ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                <div className="h-16 flex items-center justify-between px-6 border-b border-blue-900">
                  <div className="flex items-center">
                    <Activity className="w-6 h-6 text-white mr-2" />

          const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
          const years = Array.from({length: 100}, (_, i) => (new Date().getFullYear() - 5 + i).toString());

          const filteredFiles = files.filter(file => {
            const monthMatch = filterMonth === 'all' || file.name.includes(filterMonth);
            const yearMatch = filterYear === 'all' || file.name.includes(filterYear);
            return monthMatch && yearMatch;
          });

          const handleDownload = (file) => {
            if (!file || !file.data || file.data.length === 0) return;
            const headers = file.headers || Object.keys(file.data[0]);
            
            let csvContent = headers.map(h => `"${String(h).replace(/"/g, '""')}"`).join(',') + '\n';
            
            file.data.forEach(row => {
                const rowContent = headers.map(header => {
                    let cell = row[header] === null || row[header] === undefined ? '' : String(row[header]);
                    cell = cell.replace(/"/g, '""');
                    if (cell.search(/("|,|\n)/g) >= 0) {
                        cell = `"${cell}"`;
                    }
                    return cell;
                }).join(',');
                csvContent += rowContent + '\n';
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", file.originalName || `${file.name.replace(/\s+/g, '_')}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
